# Atualiza os manifestos (projects/projects.json, tools/tools.json, games/games.json...)
# e publica o site no GitHub Pages.
#
# 1) Roda scripts/build-manifests.mjs, que lista as pastas de cada categoria
#    definida em assets/js/categories.js.
# 2) Se algum manifesto mudou, faz commit de volta na main com [skip ci]
#    (commits feitos com GITHUB_TOKEN também não disparam novos workflows, então não há loop).
# 3) Publica o site via GitHub Actions (Pages com source = "GitHub Actions").
#    Obs.: com o modo "Deploy from a branch", commits feitos pelo GITHUB_TOKEN
#    NÃO disparam rebuild do Pages, por isso o deploy é feito aqui mesmo.
name: Site (manifesto + Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commitar os manifestos
  pages: write      # publicar no Pages
  id-token: write   # exigido pelo deploy-pages

concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (histórico completo para as datas do git)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conferir traduções (assets/i18n)
        run: node scripts/check-i18n.mjs

      - name: Gerar manifestos (projects, tools, games...)
        run: node scripts/build-manifests.mjs

      - name: Commitar manifestos (se mudaram)
        run: |
          mapfile -t FILES < <(node scripts/build-manifests.mjs --list)
          git add -- "${FILES[@]}"
          if git diff --cached --quiet; then
            echo "Manifestos já estão em dia."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: atualiza manifestos [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
